name: Deploy to Server (Development)

on:
  push:
    branches:
      - development

jobs:
  deploy:
    name: Build Docker and Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: 🐳 Build Docker Image
        run: |
          docker build -t lms-backend .

      - name: 🗜️ Save Docker Image to File
        run: |
          docker save lms-backend | gzip > lms-backend.tar.gz

      - name: 🔐 Set up SSH Agent for VPS
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: 🚚 Copy Docker Image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "lms-backend.tar.gz"
          target: "~/lms-backend.tar.gz"

      - name: Load and Run Docker Image on VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            docker load < ~/lms-backend.tar.gz
            rm -f ~/lms-backend.tar.gz

            echo "🚀 Restarting container..."
            docker stop lms-backend || true
            docker rm lms-backend || true

            docker run -d \
              --name lms-backend \
              -p 5000:5000 \
              --env-file ~/Learning-Application-Server/.env \
              lms-backend

            echo "✅ Deployment complete."
          EOF
