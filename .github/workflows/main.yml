name: Deploy to Server (Development)

on:
  push:
    branches:
      - development

jobs:
  deploy:
    name: SSH Deploy & Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up SSH for Server
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Upload GitHub Repo Deploy Key to Server
        run: |
          echo "${{ secrets.REPO_SSH_KEY }}" | tr -d '\r' > id_rsa_server
          chmod 600 id_rsa_server
          scp -o StrictHostKeyChecking=no id_rsa_server ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/.ssh/id_rsa_server        

      - name: Configure SSH for GitHub on Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOSSH'
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh

            echo -e "Host github.com\n  IdentityFile ~/.ssh/id_rsa_server\n  IdentitiesOnly yes" > ~/.ssh/config
            chmod 600 ~/.ssh/config
          EOSSH

      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e  # stop on error

            cd ~/Learning-Application-Server

            echo "🔄 Pulling latest code..."
            git pull origin development

            echo "🐳 Rebuilding Docker containers..."
            docker-compose down -v
            docker-compose up --build -d

            echo "✅ Deployment complete."
          EOF
